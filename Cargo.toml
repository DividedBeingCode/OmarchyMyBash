[workspace]
members = ["crates/omarchy10kd", "crates/omarchy10k"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Ian Johnston"]
# NOTE: update this when the public repo name is settled -- a PKGBUILD
# will source from it, and §7 of docs/omarchy-plugin-packaging.md lists a
# wrong/absent source as a last-minute blocker.
repository = "https://github.com/DividedBeingCode/OmarchyMyBash"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
notify-debouncer-full = "0.5"
directories = "6"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
unicode-width = "0.2"
# PNG only — the `image` crate would pull a dozen decoders we never use.
png = "0.17"
