[workspace]
members = ["crates/omarchy10kd", "crates/omarchy10k"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ian Johnston"]
repository = "https://github.com/ijohnst/omarchy10k"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
notify-debouncer-full = "0.5"
directories = "6"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
