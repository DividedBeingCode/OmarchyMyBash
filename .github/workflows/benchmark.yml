name: Benchmark Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      # The daemon names its socket $XDG_RUNTIME_DIR/omarchy10k-{O10K_PARENT_PID}.sock
      # and the CLI resolves the same path from O10K_PARENT_PID. Daemon start and
      # benchmark runs therefore share ONE step so O10K_PARENT_PID (and the socket)
      # stay in a consistent namespace. O10K_PARENT_PID is this step's shell, which
      # outlives the benchmarks; the daemon is stopped explicitly at the end.
      - name: Start daemon and run benchmarks
        run: |
          export O10K_PARENT_PID=$$
          ./target/release/omarchy10kd &
          DAEMON_PID=$!

          SOCKET="${XDG_RUNTIME_DIR:-/tmp}/omarchy10k-$$.sock"
          for _ in $(seq 1 50); do
            [[ -S "$SOCKET" ]] && break
            kill -0 "$DAEMON_PID" 2>/dev/null || break
            sleep 0.1
          done
          [[ -S "$SOCKET" ]] || { echo "::error::daemon socket never appeared at $SOCKET"; exit 1; }

          set -o pipefail
          ./target/release/omarchy10k benchmark --iterations 200 | tee benchmark-results.json
          ./target/release/omarchy10k benchmark-shell --iterations 200 | tee benchmark-shell-results.json

          kill "$DAEMON_PID" 2>/dev/null || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-shell-results.json
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --workspace

      - name: Integration tests
        run: bash tests/integration_test.sh
