[prompt]
layout = "omarchy"         # legacy key — use [style] preset instead
transient = true
newline = true             # two-line prompt
right_prompt = true

# ── Style System ────────────────────────────────────────
# Curated visual presets that control separators, frames, and layout.
# Override individual aspects with [style.separators], [style.frame], [style.caps].

[style]
preset = "omarchy"         # omarchy | powerline | rainbow | framed | classic | lean | dense | slanted | minimal | pure

# [style.separators]      # override preset separator (powerline|slanted|round|vertical|dot|diamond|none)
# left = ""
# right = ""

# [style.frame]           # connecting lines between prompt lines
# enabled = false
# left = true
# right = true
# gap_char = ""            # ─ | · | none

# [style.caps]            # edge decorations at prompt boundaries
# left_start = ""
# left_end = ""
# right_start = ""
# right_end = ""

[theme]
source = "omarchy"         # omarchy | custom | hybrid | terminal
# Custom palette overrides (only used when source = "custom" or "hybrid")
# [theme.custom]
# accent = "#bb9af7"
# foreground = "#c0caf5"
# muted = "#565f89"
# background = "#1a1b26"
# red = "#f7768e"
# green = "#9ece6a"
# yellow = "#e0af68"
# blue = "#7aa2f7"

[directory]
strategy = "smart"          # smart | full | truncate
max_length = 40
repo_root_style = "bold"

[git]
enabled = true
mode = "adaptive"           # hidden | compact | expanded | adaptive
stale_display = true        # show stale (grey) state while refreshing
max_threads = 4
cache_ttl_ms = 5000         # git status cache lifetime in milliseconds
branch_icon = "powerline"   # powerline | octicon | nerd | text | none

[segments.os]
enabled = true
icon = "arch"               # arch | ubuntu | debian | fedora | nixos | macos | windows | linux | omarchy | alpine | void | gentoo | none

[segments.exit_status]
enabled = true
show_signal_name = true     # show SIGKILL instead of 137

[segments.command_duration]
enabled = true
show_above_ms = 1500

[segments.jobs]
enabled = true

[segments.ssh]
enabled = true
show = "auto"               # auto | always | never

[segments.character]
success = "❯"               # chevron | arrow | lambda | dollar | angle | percent | triangle | hash | custom
error = "❯"
transient = "❯"             # glyph for transient (collapsed) prompt

# ── v0.3 Context Segments ────────────────────────────────

[segments.container]
enabled = true
icon = "auto"               # auto-detects Docker, Podman, LXC, etc.

[segments.python]
enabled = true              # shows active venv or conda env

[segments.toolchain]
enabled = true              # shows Mise-managed tool versions

[segments.nix]
enabled = true              # shows Nix shell (pure/impure)

[segments.k8s]
enabled = false             # shows current Kubernetes context
show_namespace = true

[segments.time]
enabled = false             # shows current time in prompt
format = "%H:%M"            # %H:%M | %H:%M:%S | %I:%M %p

[segments.battery]
enabled = false             # shows battery level (laptop only)
show_above = 100            # always show (set lower to hide when charging)
threshold_warning = 30
threshold_critical = 10

[segments.notification]
enabled = true
threshold_ms = 10000        # desktop notification for commands longer than this

# ── Terminal Features ────────────────────────────────────

[terminal.title]
enabled = true
format = "{dir}"            # placeholders: {dir}, {user}, {host}, {branch}

[terminal.progress]
enabled = true              # OSC 9;4 progress bar during command execution

[daemon]
socket = "auto"
log_level = "warn"          # trace | debug | info | warn | error
