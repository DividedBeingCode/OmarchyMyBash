[prompt]
layout = "omarchy"         # legacy key — use [style] preset instead
transient = true
newline = true             # two-line prompt
right_prompt = true

# ── Style System ────────────────────────────────────────
# Curated visual presets that control separators, frames, and layout.
# Override individual aspects with [style.separators], [style.frame], [style.caps].

[style]
preset = "omarchy"         # omarchy | powerline | rainbow | framed | classic | lean | dense | slanted | minimal | pure

# [style.separators]      # override preset separator (powerline|powerline_thin|slanted|round|vertical|dot|diamond|fade|fade_rev|trapezoid|trapezoid_rev|flame|dither|none)
# shape = "auto"            # geometry family for BOTH sides at once (auto = preset default)
# left = ""
# right = ""

# [style.frame]           # connecting lines between prompt lines
# enabled = false
# left = true
# right = true
# gap_char = ""            # ─ | · | none
# gap_gradient = "off"     # off | subtle | full — interpolate the gap fill (accent → complement)

# [style.caps]            # edge decorations at prompt boundaries
# left_start = ""
# left_end = ""
# right_start = ""
# right_end = ""

[theme]
source = "omarchy"         # omarchy | custom | hybrid | terminal
# Custom palette overrides (only used when source = "custom" or "hybrid")
# [theme.custom]
# accent = "#bb9af7"
# foreground = "#c0caf5"
# muted = "#565f89"
# background = "#1a1b26"
# red = "#f7768e"
# green = "#9ece6a"
# yellow = "#e0af68"
# blue = "#7aa2f7"

[directory]
strategy = "smart"          # smart | full | truncate
max_length = 40
repo_root_style = "bold"
unique = false              # truncate_to_unique: shortest unambiguous path components
anchors = [".git", "Cargo.toml", "package.json", "pyproject.toml", "go.mod", "Gemfile", "flake.nix", "README.md"]

[git]
enabled = true
stale_display = true        # show stale (grey) state while refreshing
stale_icon = "⟳"            # glyph prepended to the branch when git data is stale

[segments.os]
enabled = true
icon = "arch"               # arch | ubuntu | debian | fedora | nixos | macos | windows | linux | omarchy | alpine | void | gentoo | none

[segments.exit_status]
enabled = true
show_signal_name = true     # show SIGKILL instead of 137

[segments.command_duration]
enabled = true
show_above_ms = 1500

[segments.jobs]
enabled = true

[segments.ssh]
enabled = true
show = "auto"               # auto | always | never

[segments.character]
success = "❯"               # chevron | arrow | lambda | dollar | angle | percent | triangle | hash | custom
error = "❯"
transient = "❯"             # glyph for transient (collapsed) prompt

# ── v0.3 Context Segments ────────────────────────────────

[segments.container]
enabled = true
icon = "auto"               # auto-detects Docker, Podman, LXC, etc.

[segments.python]
enabled = true              # shows active venv or conda env

[segments.toolchain]
enabled = true              # shows Mise-managed tool versions

[segments.nix]
enabled = true              # shows Nix shell (pure/impure)

[segments.k8s]
enabled = false             # shows current Kubernetes context
show_namespace = true

[segments.time]
enabled = false             # shows current time in prompt
format = "%H:%M"            # %H:%M | %H:%M:%S | %I:%M %p

strategy = "smart"          # smart | flat | compact
max_length = 40
repo_root_style = "bold"
unique = false              # truncate_to_unique: shortest unambiguous path components
anchors = [".git", "Cargo.toml", "package.json", "pyproject.toml", "go.mod", "Gemfile", "flake.nix", "README.md"]

[segments.load]
enabled = false             # braille load-average sparkline (▁▂▃▄▅▆▇█)
width = 16

[segments.battery]
enabled = false             # shows battery level (laptop only)
show_above = 100            # always show (set lower to hide when charging)
threshold_warning = 30
threshold_critical = 10

[segments.ai]
enabled = true              # agent signal segment (Claude Code / Codex, env-detected)
hide_below_cols = 60

[notifications]
enabled = true              # long-command desktop notifications
threshold_ms = 10000        # notify for commands longer than this (ms); 0-disable emits threshold 0
unfocused_only = false      # bash-side focus gating hint

[statusline]
context_warning_pct = 60    # context % at which the statusline turns yellow
context_critical_pct = 85   # context % at which the statusline turns red

[terminal.semantic_prompts]
enabled = false             # OSC 133;C/D emission (adapter-gated; v0.4 default OFF)

[segments.notification]    # DEPRECATED alias of [notifications]; kept for old configs
enabled = true
threshold_ms = 10000        # desktop notification for commands longer than this

# ── Terminal Features ────────────────────────────────────

[terminal.title]
enabled = true
format = "{dir}"            # placeholders: {dir}, {user}, {host}, {branch}

[terminal.progress]
enabled = true              # OSC 9;4 progress bar during command execution

[daemon]
socket = "auto"
log_level = "warn"          # trace | debug | info | warn | error

# ── Environment Channel (v0.4) ───────────────────────────
# The bash adapter sends these variables in the prompt request's `env`
# object; daemon segments read them instead of the daemon process env.
# The default list is the frozen protocol 0.4 allowlist and must match the
# adapter. Add CLAUDE_CODE_ENTRYPOINT / CODEX_* here to power the agent
# signal segment.
[env.watch]
keys = ["VIRTUAL_ENV", "CONDA_DEFAULT_ENV", "MISE_NODE_VERSION", "MISE_PYTHON_VERSION", "MISE_RUBY_VERSION", "MISE_GO_VERSION", "MISE_RUST_VERSION", "IN_NIX_SHELL", "DISTROBOX_ENTER_PATH", "container", "KUBECONFIG", "DIRENV_DIR", "CLAUDE_CODE_ENTRYPOINT", "CODEX_SANDBOX", "CODEX_HOME"]

# ── Shell Layer (platform coexistence, wave C2) ──────────────────────────
# Claim policy for shell-layer items (ls, lt, cd/zoxide, fzf keys, MANPAGER,
# grep, …). Resolved once at `omarchy10k init bash` and baked into the
# emitted adapter — no runtime config reads in the shell. User definitions
# ALWAYS win and are not configurable. Defaults live in the CLI
# (crates/omarchy10k, serde/toml-side), not here — this file is
# documentation and is not parsed.
#
# [shell.layer]
# policy = "extend"          # extend | defer | own | off — global default
#
# [shell.layer.overrides]    # per-claim override of the global policy
# ls = "extend"              # keep Omarchy's eza flags, append --git
# grep = "defer"             # opt out of the rg-for-grep substitution

# ── Rice Layer (theme-reactive tool configs) ─────────────────────────────
# Defaults live in serde (crates/omarchy10kd/src/config.rs RiceConfig);
# this file is documentation and is not parsed.
#
# [rice]
# bat_theme = "ansi"         # ansi | themed — "ansi" (default) defers to
#                            # Omarchy's BAT_THEME=ansi (bat inherits the
#                            # theme-synced terminal palette); "themed"
#                            # picks a named bat bundle per light/dark mode
# blesh_faces = true         # emit ble.sh face mapping (o10k-blesh.bash.tpl;
#                            # inert unless ble.sh is active)
# delta = true               # emit delta theme (o10k-delta.gitconfig.tpl;
#                            # inert until included from ~/.gitconfig)
